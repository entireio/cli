# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2
pro: true

before:
  hooks:
    - go mod tidy
    - mise run completions

builds:
  - id: entire
    main: ./cmd/entire
    binary: entire
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/entireio/cli/cmd/entire/cli/versioninfo.Version={{.Version}}
      - -X github.com/entireio/cli/cmd/entire/cli/versioninfo.Commit={{.ShortCommit}}
      - -X github.com/entireio/cli/cmd/entire/cli/telemetry.PostHogAPIKey={{.Env.POSTHOG_API_KEY}}
      - -X github.com/entireio/cli/cmd/entire/cli/telemetry.PostHogEndpoint={{.Env.POSTHOG_ENDPOINT}}
      # Experimental-command visibility: hide in stable releases, keep visible
      # in nightly (prerelease) builds. .Prerelease is empty for a stable tag
      # (vX.Y.Z) and non-empty for a nightly tag (vX.Y.Z-nightly.*). Local
      # builds carry no stamp and use the package default ("true" = visible).
      - -X github.com/entireio/cli/cmd/entire/cli/experimental.Visible={{ if .Prerelease }}true{{ else }}false{{ end }}

  # git-remote-entire is the git remote helper for entire:// URLs (see
  # cmd/git-remote-entire). A small, dedicated binary shipped alongside
  # entire so `git clone entire://…` resolves it on PATH — no telemetry,
  # only the versioninfo stamp it needs for its git agent string.
  - id: git-remote-entire
    main: ./cmd/git-remote-entire
    binary: git-remote-entire
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/entireio/cli/cmd/entire/cli/versioninfo.Version={{.Version}}
      - -X github.com/entireio/cli/cmd/entire/cli/versioninfo.Commit={{.ShortCommit}}

notarize:
  macos:
    # Must list every darwin build id explicitly. When omitted, goreleaser
    # defaults the id filter to the project name ("cli"), which matched the
    # old single unnamed build but matches neither named build above — the
    # notarize pipe then silently skips and ships ad-hoc-signed binaries that
    # Gatekeeper kills on launch.
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - entire
        - git-remote-entire
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true # do not let an unusable binary slip into the wild

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "entire_{{ .Os }}_{{ .Arch }}"
    files:
      - src: completions/*
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto

scoops:
  # Name the manifest (and therefore the Scoop app directory) "entire". Without
  # this, goreleaser defaults the manifest name to the project name, which
  # resolves to the repo name ("cli"), so `scoop install` lands the binary in
  # …\scoop\apps\cli\current\entire.exe. That mismatched app-dir name is
  # surprising ("scoop install cli"?) and fed the Windows hook-path bug in
  # https://github.com/entireio/cli/issues/1424.
  - name: entire
    repository:
      owner: entireio
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/entireio/cli"
    description: "CLI for Entire"
    license: MIT
    skip_upload: auto

  # Transition manifest for the pre-rename package name. Before the "entire"
  # manifest existed, goreleaser defaulted the name to the project name, so
  # existing Windows installs are registered as app "cli" and `scoop update`
  # resolves their updates from cli.json — dropping it orphans those installs
  # silently (no error, no more updates). Keep publishing it so `scoop update
  # cli` still delivers the latest binary. That binary carries the in-CLI
  # migration: when it detects it is running from the `cli` app dir it points
  # the user at the Scoop commands to move onto the renamed `entire` package
  # (see cmd/entire/cli/versioncheck). The post_install prints the same nudge.
  #
  # Accepted cost of the transition window: `scoop search entire` lists both
  # packages, so a new user can still install the deprecated `cli`. Scoop has no
  # deprecation field — the description below is the only signal available.
  #
  # No `depends: [entire]`: pulling in the `entire` package automatically would
  # fight the CLI-driven migration and ownership of the shims both manifests
  # declare (`entire.exe` and `git-remote-entire.exe`). The renamed `entire`
  # package is installed only when the user runs the migration commands.
  #
  # Drop this entry (and the `scoopAppName() == "cli"` branch in
  # cmd/entire/cli/versioncheck) no earlier than v0.12.0. There is no telemetry
  # dimension for the install manager, so completion can't be measured — the
  # version is a deliberate cutoff, not an observation. Dropping it orphans any
  # remaining `cli` installs silently, so if a data-driven call is wanted
  # instead, add the Scoop app dir as a telemetry dimension first.
  - name: cli
    repository:
      owner: entireio
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/entireio/cli"
    description: "CLI for Entire (renamed to 'entire' — install that instead)"
    license: MIT
    post_install:
      - "Write-Host \"This package was renamed to 'entire'. Migrate with (run when entire is not running):\" -ForegroundColor Yellow"
      - "Write-Host '  cmd.exe /D /C \"scoop install entire/entire && scoop uninstall entire/cli && scoop reset entire\"' -ForegroundColor Yellow"
    skip_upload: auto

homebrew_casks:
  - name: entire
    repository:
      owner: entireio
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/entireio/cli"
    description: "CLI for Entire"
    binaries:
      - entire
      - git-remote-entire
    generate_completions_from_executable:
      executable: entire
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
    conflicts:
      - cask: entire@nightly
    skip_upload: auto

  - name: entire@nightly
    repository:
      owner: entireio
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/entireio/cli"
    description: "CLI for Entire (nightly build)"
    binaries:
      - entire
      - git-remote-entire
    generate_completions_from_executable:
      executable: entire
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
    conflicts:
      - cask: entire
    # Nightly-tags only, not "any prerelease". `not .Prerelease` skipped just
    # stable, so a second prerelease channel (-dev., published on every merge to
    # main) would have overwritten this externally-consumed cask many times a day
    # and quietly turned `brew install --cask entire@nightly` into a main tracker.
    # Verified with goreleaser 2.17.1 that `contains` renders here and
    # distinguishes the two tag shapes.
    skip_upload: '{{ if not (contains .Prerelease "nightly") }}true{{ end }}'

announce:
  discord:
    enabled: '{{ and (not .Prerelease) (isEnvSet "DISCORD_WEBHOOK_ID") (isEnvSet "DISCORD_WEBHOOK_TOKEN") }}'
    message_template: "Beep, boop. **Entire CLI {{ .Tag }}** is out!\n\n{{ .ReleaseURL }}\n\nSee https://docs.entire.io/cli/installation for help installing and updating."
    author: "Entire"
