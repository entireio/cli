name: Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - name: Core Tests
        env:
          GO_TEST_PARALLEL: "16"
        run: mise run test:ci:core

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - name: Integration Tests
        env:
          GO_TEST_PARALLEL: "16"
        run: mise run test:ci:integration:shard -- ${{ matrix.shard }}

  test-codex-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - name: Install latest Codex CLI
        run: npm install --global @openai/codex
      - name: Codex app-server integration tests
        env:
          ENTIRE_TEST_REQUIRE_CODEX_APP_SERVER: "1"
        run: go test -tags=integration -race -count=1 ./cmd/entire/cli/integration_test -run '^TestCodexAppServerHooksList_'

  test-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Run the (no-cost, no-API) Vogon canary against each checkpoint backend so
      # the git-refs store is guarded on every PR alongside the default git-branch.
      matrix:
        checkpoint_store: [git-branch, git-refs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - name: E2E Canary
        env:
          E2E_CHECKPOINT_STORE: ${{ matrix.checkpoint_store }}
        run: mise run test:e2e:canary

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Real-Windows tests must include Windows or MSYS in their top-level
      # test name so this job selects them without running POSIX-only harnesses.
      - name: Windows unit tests
        run: go test ./cmd/entire/cli/... -run '(Windows|MSYS)' -count=1 -v

  # Fails only on functions this pull request made new or worse than the merge
  # base; the repo's ~105 pre-existing violations are exempt. Deliberately not
  # the gocognit linter: golangci has no per-linter new-only mode, so enabling
  # it would fail `mise run lint` locally on all of them, and the action's
  # only-new-issues switch is workflow-wide. See tools/complexity/README.md.
  complexity-gate:
    # Pull requests only: the gate diffs against the merge base with the target
    # branch, and a push to main has no such base to diff against.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The merge base is resolved locally, so both sides of the history
          # have to be present.
          fetch-depth: 0
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4
      - name: Complexity gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: mise run complexity:gate

  test:
    runs-on: ubuntu-latest
    needs:
      - test-core
      - test-integration
      - test-codex-hooks
      - test-canary
      - test-windows
      - complexity-gate
    if: ${{ always() }}
    steps:
      - name: Check dependencies
        run: |
          [ "${{ needs.test-core.result }}" = "success" ]
          [ "${{ needs.test-integration.result }}" = "success" ]
          [ "${{ needs.test-codex-hooks.result }}" = "success" ]
          [ "${{ needs.test-canary.result }}" = "success" ]
          [ "${{ needs.test-windows.result }}" = "success" ]
          # "skipped" is the push-to-main and workflow_dispatch case, where the
          # gate has no merge base and does not run.
          [ "${{ needs.complexity-gate.result }}" = "success" ] || [ "${{ needs.complexity-gate.result }}" = "skipped" ]
