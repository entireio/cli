name: E2E Isolated Test

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to test"
        required: true
        default: "gemini-cli"
        type: choice
        options: [claude-code, opencode, gemini-cli, antigravity, cursor-cli, factoryai-droid, copilot-cli, roger-roger, codex]
      test:
        description: "Test name filter (regex)"
        required: true
        default: "TestInteractiveMultiStep"

jobs:
  e2e-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Build entire CLI
        run: go build -o /usr/local/bin/entire ./cmd/entire

      - name: Install agent CLI
        run: |
          case "${{ inputs.agent }}" in
            claude-code) curl -fsSL https://claude.ai/install.sh | bash ;;
            opencode)    curl -fsSL https://opencode.ai/install | bash ;;
            gemini-cli)  npm install -g @google/gemini-cli ;;
            antigravity)
              mkdir -p "$HOME/.local/bin"
              tmp="$(mktemp -d)"
              curl -fsSL https://github.com/google-antigravity/antigravity-cli/releases/latest/download/agy_cli_linux_x64.tar.gz -o "$tmp/agy.tar.gz"
              tar -xzf "$tmp/agy.tar.gz" -C "$tmp"
              # The release tarball ships the binary as `antigravity` (every 1.x
              # release so far); `agy` is the name it is installed under.
              agy_bin="$(find "$tmp" -type f \( -name antigravity -o -name agy \) | head -n 1)"
              test -n "$agy_bin"
              install -m 0755 "$agy_bin" "$HOME/.local/bin/agy"
              ;;
            codex)       npm install -g @openai/codex ;;
            cursor-cli)  curl https://cursor.com/install -fsS | bash ;;
            factoryai-droid) curl -fsSL https://app.factory.ai/cli | sh ;;
            copilot-cli)  npm install -g @github/copilot  ;;
            roger-roger) ;; # installed by mise (see mise.toml)
          esac
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify roger-roger agent
        if: inputs.agent == 'roger-roger'
        run: |
          set -euo pipefail
          echo "Verifying roger-roger binaries on PATH..."
          command -v roger-roger
          command -v entire-agent-roger-roger

      - name: Configure Antigravity ADC
        if: inputs.agent == 'antigravity'
        env:
          ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          # ADC is optional since agy 1.1.13: without the secret the harness runs
          # agy in Gemini API-key mode (GEMINI_API_KEY, shared with gemini-cli).
          if [ -z "${ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            echo "No ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON secret; Antigravity E2E uses GEMINI_API_KEY (agy API-key mode)"
            exit 0
          fi
          creds="$RUNNER_TEMP/antigravity-google-credentials.json"
          install -m 600 /dev/null "$creds"
          printf '%s' "$ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$creds"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$creds" >> "$GITHUB_ENV"

      - name: Bootstrap agent
        if: inputs.agent != 'roger-roger'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          # Only copilot-cli gets the token; other agents must not receive it.
          COPILOT_GITHUB_TOKEN: ${{ inputs.agent == 'copilot-cli' && secrets.COPILOT_GITHUB_TOKEN || '' }}
        run: go run ./e2e/bootstrap

      - name: Run isolated test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          E2E_CODEX_MODEL: ${{ inputs.agent == 'codex' && 'gpt-5.4-mini' || '' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          # Only copilot-cli gets the token; other agents must not receive it.
          COPILOT_GITHUB_TOKEN: ${{ inputs.agent == 'copilot-cli' && secrets.COPILOT_GITHUB_TOKEN || '' }}
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
          E2E_ENTIRE_BIN: /usr/local/bin/entire
        run: |
          mkdir -p "$E2E_ARTIFACT_DIR"
          mise run test:e2e --agent ${{ inputs.agent }} "${{ inputs.test }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-isolated-${{ inputs.agent }}-${{ inputs.test }}
          path: e2e-artifacts/
          retention-days: 7
