name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent selection (all: standard matrix)'
        required: false
        type: choice
        default: all
        options:
          - all
          - claude-code
          - opencode
          - gemini-cli
          - factoryai-droid
          - cursor-cli
          - copilot-cli
          - roger-roger
          - codex
      test:
        description: 'Test regex (empty runs the full suite)'
        required: false
        type: string
        default: ''
      runner:
        description: Runner for the selected agents
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, macos-latest, windows-latest]
  push:
    branches:
      - main

# Cancel an older source-suite run when a new one starts.
concurrency:
  group: e2e-tests
  cancel-in-progress: true

jobs:
  claude-code:
    if: ${{ inputs.agent == 'claude-code' || inputs.agent == '' || inputs.agent == 'all' }}
    name: claude-code (${{ inputs.runner || 'ubuntu-latest' }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    with:
      agent: claude-code
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      test-regex: ${{ inputs.test }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  opencode:
    if: ${{ inputs.agent == 'opencode' || ((inputs.agent == '' || inputs.agent == 'all') && inputs.runner != 'windows-latest') }}
    name: opencode (${{ inputs.runner || 'ubuntu-latest' }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    with:
      agent: opencode
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      test-regex: ${{ inputs.test }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  gemini-cli:
    if: ${{ inputs.agent == 'gemini-cli' }}
    name: gemini-cli (${{ inputs.runner || 'ubuntu-latest' }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    with:
      agent: gemini-cli
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      test-regex: ${{ inputs.test }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  factoryai-droid:
    if: ${{ inputs.agent == 'factoryai-droid' || ((inputs.agent == '' || inputs.agent == 'all') && inputs.runner != 'windows-latest') }}
    name: factoryai-droid (${{ inputs.runner || 'ubuntu-latest' }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    with:
      agent: factoryai-droid
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      test-regex: ${{ inputs.test }}
    secrets:
      FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

  cursor-cli:
    if: ${{ inputs.agent == 'cursor-cli' || ((inputs.agent == '' || inputs.agent == 'all') && inputs.runner != 'windows-latest') }}
    name: cursor-cli (${{ inputs.runner || 'ubuntu-latest' }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    with:
      agent: cursor-cli
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      test-regex: ${{ inputs.test }}
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

  copilot-cli:
    if: ${{ inputs.agent == 'copilot-cli' || ((inputs.agent == '' || inputs.agent == 'all') && inputs.runner != 'windows-latest') }}
    name: copilot-cli (${{ inputs.runner || 'ubuntu-latest' }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
      copilot-requests: write
    with:
      agent: copilot-cli
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      test-regex: ${{ inputs.test }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  roger-roger:
    if: ${{ inputs.agent == 'roger-roger' || ((inputs.agent == '' || inputs.agent == 'all') && inputs.runner != 'windows-latest') }}
    name: roger-roger (${{ inputs.runner || 'ubuntu-latest' }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    with:
      agent: roger-roger
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      test-regex: ${{ inputs.test || 'TestExternalAgent' }}

  codex:
    if: ${{ inputs.agent == 'codex' || ((inputs.agent == '' || inputs.agent == 'all') && inputs.runner != 'windows-latest') }}
    name: codex (${{ inputs.runner || 'ubuntu-latest' }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    with:
      agent: codex
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      test-regex: ${{ inputs.test }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  e2e-windows:
    if: github.event_name == 'push'
    name: claude-code (windows-latest)
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    with:
      agent: claude-code
      runner: windows-latest
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  notify-slack:
    runs-on: ubuntu-latest
    needs: [claude-code, opencode, gemini-cli, factoryai-droid, cursor-cli, copilot-cli, roger-roger, codex, e2e-windows]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name == 'push' }}
    permissions:
      actions: read
    steps:
      # Classify the failed jobs into two severities:
      #   RED    — a "reliable" agent (or Windows) failed. These pass on every
      #            healthy run, so a failure here is a real regression.
      #   YELLOW — only a known-flaky agent failed. Worth investigating, but not
      #            a `main` regression. Reported so we don't lose visibility.
      - name: Classify failures
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Windows remains a reliable leg regardless of its selected agent.
          reliable="claude-code opencode gemini-cli roger-roger"

          failed_names=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name')

          red=""
          yellow=""
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            case "$name" in
              *windows-latest*) red="$red windows"; continue ;;
            esac
            # Reusable jobs end in " / <agent>".
            agent="${name##* / }"
            case " $reliable " in
              *" $agent "*) red="$red $agent" ;;
              *)
                case "$agent" in
                  codex|cursor-cli|factoryai-droid|copilot-cli) yellow="$yellow $agent" ;;
                  *) red="$red infrastructure" ;;
                esac ;;
            esac
          done <<EOF
          $failed_names
          EOF

          # Each list was built as " a b c" (leading space, space-separated).
          # Strip the leading space, then join on ", ". Empty stays empty.
          red="${red# }";       red="${red// /, }"
          yellow="${yellow# }"; yellow="${yellow// /, }"

          if [ -n "$red" ]; then
            color="#d50200"
            header=":red_circle: *E2E Tests Failed* on \`main\`"
          else
            color="#daa038"
            header=":large_yellow_circle: *E2E flaky-agent failures* on \`main\`"
          fi

          body=""
          [ -n "$red" ]    && body="${body}Reliable agents (regression): *${red}*\\n"
          [ -n "$yellow" ] && body="${body}Flaky agents (investigate): *${yellow}*\\n"

          {
            echo "color=$color"
            echo "header=$header"
            echo "body=$body"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack of E2E failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.E2E_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.classify.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ steps.classify.outputs.header }}\n\n${{ steps.classify.outputs.body }}<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run details>"
                      }
                    },
                    {
                      "type": "context",
                      "elements": [
                        {
                          "type": "mrkdwn",
                          "text": "Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> by ${{ github.actor }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
