name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Run a single agent (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - claude-code
          - opencode
          - antigravity
          - factoryai-droid
          - cursor-cli
          - copilot-cli
          - roger-roger
          - codex
      test:
        description: 'Test name filter (regex; empty runs the full suite)'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main

# Concurrency: only one E2E job runs at a time
concurrency:
  group: e2e-tests
  cancel-in-progress: true

# Deny by default: matrix-setup needs no token at all, and the three jobs that
# do need one declare exactly what they use.
permissions: {}

jobs:
  # Build the matrix dynamically so workflow_dispatch can select a single agent.
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.set.outputs.agents }}
    steps:
      - id: set
        # Pass the input through env rather than interpolating it into the script:
        # `type: choice` only constrains the UI, so a REST-API dispatch could inject
        # shell metacharacters here otherwise.
        env:
          AGENT_INPUT: ${{ github.event.inputs.agent }}
        run: |
          input="$AGENT_INPUT"
          if [ -n "$input" ]; then
            echo "agents=[\"$input\"]" >> "$GITHUB_OUTPUT"
          else
            # antigravity runs in agy's Gemini API-key mode (the
            # GEMINI_API_KEY repo secret, no account session). agy < 1.1.25 loaded
            # .agents/hooks.json on that route but never executed the hooks
            # (google-antigravity/antigravity-cli#893); the install step above
            # always fetches the latest release, which has executed them since
            # 1.1.25. With the optional ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON
            # secret the leg runs on ADC instead.
            echo 'agents=["claude-code","opencode","factoryai-droid","cursor-cli","copilot-cli","roger-roger","codex","antigravity"]' >> "$GITHUB_OUTPUT"
          fi

  e2e-tests:
    needs: matrix-setup
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      # Needed by the copilot-cli leg. GitHub does not allow matrix expressions in
      # `permissions:`, so this scope is granted to every leg's GITHUB_TOKEN. The
      # token is kept away from non-copilot agents in two ways: it is only placed
      # in COPILOT_GITHUB_TOKEN for the copilot-cli leg (see env blocks below), and
      # checkout runs with persist-credentials: false so it is not left in
      # .git/config for an agent process to read.
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.matrix-setup.outputs.agents) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't persist the (copilot-scoped) GITHUB_TOKEN in .git/config, where
          # an agent process running in the checkout could read it.
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install agent CLI
        run: |
          case "${{ matrix.agent }}" in
            claude-code) curl -fsSL https://claude.ai/install.sh | bash ;;
            opencode)    curl -fsSL https://opencode.ai/install | bash ;;
            antigravity)
              # Deliberately NOT pinned, because pinning agy does not work.
              # agy self-updates IN PLACE — the updater replaces the executable
              # at its own path, which in CI is the file installed here — and
              # it spawns that updater on essentially every launch, ~0.4s in,
              # with auth not gating it. Its only brake is a 15-minute check
              # keyed on state a fresh CI home never has. So a pinned tarball
              # governs only the FIRST agy spawn of the job, and the harness
              # spawns agy once per prompt (e2e/agents/antigravity.go), so
              # everything after prompt one runs whatever the updater fetched.
              # Measured on Windows 11 ARM64: 1.2.7 installed, one headless
              # prompt, 1.2.9 at the same path afterwards. agy offers no way
              # out — no flag, no settings key, no env var.
              #
              # The consequence, stated rather than implied: this job's agy
              # version floats, so a third-party agy regression CAN redden PRs
              # that never touched Antigravity (see #893). That exposure was
              # always real; the pin that used to sit here only read like
              # protection. Closing it needs the updater actually blocked —
              # an unwritable install path, or no egress for this step — and
              # neither is tested yet.
              #
              # nightly-e2e.yml also tracks latest, but for its own reason:
              # that job exists to report agy drift.
              curl -fsSL https://antigravity.google/cli/install.sh | bash
              ;;
            codex)       npm install -g @openai/codex ;;
            cursor-cli)  curl https://cursor.com/install -fsS | bash ;;
            factoryai-droid) curl -fsSL https://app.factory.ai/cli | sh ;;
            copilot-cli)  npm install -g @github/copilot  ;;
            roger-roger) ;; # installed by mise (see mise.toml)
          esac
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify roger-roger agent
        if: matrix.agent == 'roger-roger'
        run: |
          set -euo pipefail
          echo "Verifying roger-roger binaries on PATH..."
          command -v roger-roger
          command -v entire-agent-roger-roger

      - name: Configure Antigravity ADC
        if: matrix.agent == 'antigravity'
        env:
          ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          # ADC is optional since agy 1.1.13: without the secret the harness runs
          # agy in Gemini API-key mode (the GEMINI_API_KEY repo secret).
          if [ -z "${ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            echo "No ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON secret; Antigravity E2E uses GEMINI_API_KEY (agy API-key mode)"
            exit 0
          fi
          creds="$RUNNER_TEMP/antigravity-google-credentials.json"
          install -m 600 /dev/null "$creds"
          printf '%s' "$ANTIGRAVITY_GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$creds"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$creds" >> "$GITHUB_ENV"

      - name: Bootstrap agent
        if: matrix.agent != 'roger-roger'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          # agy's API-key mode. Scoped to its own leg for the same reason the
          # token below is: an agent that does not need a credential does not
          # get one. nightly-e2e.yml and e2e-windows.yml wire it too.
          GEMINI_API_KEY: ${{ matrix.agent == 'antigravity' && secrets.GEMINI_API_KEY || '' }}
          # Only the copilot-cli leg gets the token; other agents must not receive it.
          COPILOT_GITHUB_TOKEN: ${{ matrix.agent == 'copilot-cli' && github.token || '' }}
        run: go run ./e2e/bootstrap

      - name: Run E2E Tests
        env:
          TEST_FILTER: ${{ inputs.test }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ matrix.agent == 'antigravity' && secrets.GEMINI_API_KEY || '' }}
          E2E_CODEX_MODEL: ${{ matrix.agent == 'codex' && 'gpt-6-luna' || '' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          # Only the copilot-cli leg gets the token; other agents must not receive it.
          COPILOT_GITHUB_TOKEN: ${{ matrix.agent == 'copilot-cli' && github.token || '' }}
          E2E_CONCURRENT_TEST_LIMIT: ${{ matrix.agent == 'factoryai-droid' && '1' || matrix.agent == 'cursor-cli' && '2' || '' }}
        # roger-roger is deterministic, so it runs through its dedicated task,
        # which does NOT enable --rerun-fails. Routing it through the default
        # task (`test:e2e`) would retry a real regression and mask it.
        run: |
          if [ "${{ matrix.agent }}" = "roger-roger" ]; then
            mise run test:e2e:roger-roger "${TEST_FILTER:-TestExternalAgent}"
          else
            mise run test:e2e --agent ${{ matrix.agent }} "$TEST_FILTER"
          fi

      # opencode writes nothing to stdout or stderr while it stalls during
      # startup, so a hung `opencode run` reaches us as an empty-output SIGKILL
      # naming no cause — which is exactly how the 2026-09-03 red streak looked
      # from the artifacts. Its own log dir is the only record of what it was
      # waiting on, so fold it into the artifact tree. Best-effort: a leg that
      # never got as far as writing logs must not fail here.
      - name: Collect opencode logs
        if: always() && matrix.agent == 'opencode'
        run: |
          mkdir -p e2e/artifacts/opencode-logs
          cp -R "$HOME/.local/share/opencode/log/." e2e/artifacts/opencode-logs/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-${{ matrix.agent }}
          path: e2e/artifacts/
          retention-days: 7

  e2e-windows:
    # Windows covers the agents e2e-windows.yml can install. An unset agent
    # (the push path) means claude-code, as before.
    if: inputs.agent == '' || inputs.agent == 'claude-code' || inputs.agent == 'factoryai-droid' || inputs.agent == 'antigravity'
    uses: ./.github/workflows/e2e-windows.yml
    permissions:
      contents: read
    with:
      test: ${{ inputs.test }}
      agent: ${{ inputs.agent || 'claude-code' }}
    secrets: inherit

  notify-slack:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    needs: [e2e-tests, e2e-windows]
    if: ${{ always() && (needs.e2e-tests.result == 'failure' || needs.e2e-windows.result == 'failure') && github.event_name == 'push' }}
    steps:
      # Classify the failed jobs into two severities:
      #   RED    — a "reliable" agent (or Windows) failed. These pass on every
      #            healthy run, so a failure here is a real regression.
      #   YELLOW — only a known-flaky agent failed. Worth investigating, but not
      #            a `main` regression. Reported so we don't lose visibility.
      - name: Classify failures
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reliable tier (RED). The e2e-windows reusable job is also RED but
          # is matched separately below since it has no "(agent)" suffix.
          reliable="claude-code opencode roger-roger"

          failed_names=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name')

          red=""
          yellow=""
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            case "$name" in
              *e2e-windows*) red="$red windows"; continue ;;
            esac
            # "e2e-tests (cursor-cli)" -> "cursor-cli"
            agent="${name#*(}"; agent="${agent%)*}"
            case " $reliable " in
              *" $agent "*) red="$red $agent" ;;
              *)            yellow="$yellow $agent" ;;
            esac
          done <<EOF
          $failed_names
          EOF

          # Each list was built as " a b c" (leading space, space-separated).
          # Strip the leading space, then join on ", ". Empty stays empty.
          red="${red# }";       red="${red// /, }"
          yellow="${yellow# }"; yellow="${yellow// /, }"

          if [ -n "$red" ]; then
            color="#d50200"
            header=":red_circle: *E2E Tests Failed* on \`main\`"
          else
            color="#daa038"
            header=":large_yellow_circle: *E2E flaky-agent failures* on \`main\`"
          fi

          body=""
          [ -n "$red" ]    && body="${body}Reliable agents (regression): *${red}*\\n"
          [ -n "$yellow" ] && body="${body}Flaky agents (investigate): *${yellow}*\\n"

          {
            echo "color=$color"
            echo "header=$header"
            echo "body=$body"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack of E2E failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.E2E_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.classify.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ steps.classify.outputs.header }}\n\n${{ steps.classify.outputs.body }}<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run details>"
                      }
                    },
                    {
                      "type": "context",
                      "elements": [
                        {
                          "type": "mrkdwn",
                          "text": "Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> by ${{ github.actor }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
