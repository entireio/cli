name: E2E Tests - CRLF validation

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent name, empty for all supported real agents
        type: string
        default: ''
      os:
        description: Runner label, or all
        type: string
        default: all
      backend:
        description: git-branch, git-refs, or all
        type: string
        default: all
      test:
        description: Test regex, empty for the full suite
        type: string
        default: ''
      code_ref:
        description: Commit to build and test, empty for this workflow branch
        type: string
        default: ''

permissions: {}

concurrency:
  group: crlf-validation-${{ github.ref }}-${{ inputs.agent }}-${{ inputs.os }}-${{ inputs.backend }}-${{ inputs.test }}-${{ inputs.code_ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          AGENT_INPUT: ${{ inputs.agent }}
          OS_INPUT: ${{ inputs.os }}
          BACKEND_INPUT: ${{ inputs.backend }}
        run: |
          python3 - <<'PY'
          import json, os
          unix = ['claude-code', 'opencode', 'codex', 'cursor-cli', 'factoryai-droid', 'copilot-cli']
          windows = ['claude-code', 'opencode', 'codex', 'copilot-cli']
          rows = [dict(os=runner, agent=agent, backend=backend)
                  for runner in ['ubuntu-latest', 'macos-latest', 'windows-latest']
                  for agent in (windows if runner == 'windows-latest' else unix)
                  for backend in ['git-branch', 'git-refs']
                  if os.environ['AGENT_INPUT'] in ['', agent]
                  and os.environ['OS_INPUT'] in ['all', runner]
                  and os.environ['BACKEND_INPUT'] in ['all', backend]]
          if not rows:
              raise SystemExit('No supported agent/OS/backend combinations selected')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('include=' + json.dumps(rows) + '\n')
          print(json.dumps(rows, indent=2))
          PY

  test:
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    defaults:
      run:
        shell: bash
    env:
      AGENT: ${{ matrix.agent }}
      TEST_FILTER: ${{ inputs.test }}
      E2E_CHECKPOINT_STORE: ${{ matrix.backend }}
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e/artifacts
      E2E_CODEX_MODEL: ${{ matrix.agent == 'codex' && 'gpt-5.4-mini' || '' }}
      E2E_CONCURRENT_TEST_LIMIT: ${{ matrix.agent == 'factoryai-droid' && '1' || matrix.agent == 'cursor-cli' && '2' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.code_ref || github.sha }}
      - name: Record tested commit
        run: |
          git rev-parse HEAD
          git config --show-origin --get core.autocrlf || true
      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install Claude on Windows
        if: runner.os == 'Windows' && matrix.agent == 'claude-code'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install agent
        if: runner.os != 'Windows' || matrix.agent != 'claude-code'
        run: |
          case "$AGENT" in
            claude-code) curl -fsSL https://claude.ai/install.sh | bash ;;
            opencode) npm install -g opencode-ai ;;
            codex) npm install -g @openai/codex ;;
            copilot-cli) npm install -g @github/copilot ;;
            cursor-cli) curl -fsSL https://cursor.com/install | bash ;;
            factoryai-droid) curl -fsSL https://app.factory.ai/cli | sh ;;
            *) echo "Unsupported agent: $AGENT"; exit 1 ;;
          esac
          if [ "$RUNNER_OS" != Windows ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
      - name: Bootstrap agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ matrix.agent == 'copilot-cli' && github.token || '' }}
        run: go run ./e2e/bootstrap "$AGENT"
      - name: Run E2E suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ matrix.agent == 'copilot-cli' && github.token || '' }}
        run: |
          mise run test:e2e --agent "$AGENT" "$TEST_FILTER"
          if grep -q '^Total: 0 ' "$E2E_ARTIFACT_DIR/report.txt"; then
            echo "No E2E tests ran"
            exit 1
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crlf-${{ matrix.os }}-${{ matrix.agent }}-${{ matrix.backend }}
          path: e2e/artifacts/
          retention-days: 7
