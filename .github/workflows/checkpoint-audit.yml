name: Checkpoint Audit

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily (GitHub does not honor sub-daily cron reliably)
  workflow_dispatch:
    inputs:
      window:
        description: 'git --since window to audit'
        default: '24 hours ago'

permissions:
  contents: read
  actions: read # required for actions/upload-artifact under a restricted token (matches e2e.yml)

concurrency:
  group: checkpoint-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # The checkpoint remote (entireio/cli-checkpoints) is public, so the audit's
      # read-only `git ls-remote` needs no credentials. If it is ever made private,
      # set ENTIRE_CHECKPOINT_TOKEN on the audit step from a token with read access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: git fetch --all --prune

      # Capture the script's exit code (0 = all present, 1 = missing, 2 =
      # remote/setup error) without failing the step, so the report, Slack, and
      # gate steps below can distinguish "missing" from "could not run".
      - name: Run checkpoint audit
        id: audit
        env:
          AUDIT_WINDOW: ${{ github.event.inputs.window || '24 hours ago' }}
        run: |
          set +e
          scripts/checkpoint-audit.sh
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checkpoint-audit-report
          path: |
            checkpoint-audit-report.md
            checkpoint-audit-report.json
          retention-days: 7
          if-no-files-found: ignore

      # Distinct wording per outcome: exit 1 asserts missing checkpoints (a report
      # artifact exists); exit 2 is a remote/setup failure with no report, so the
      # alert must not claim checkpoints are missing (avoids false positives).
      - name: Compose Slack message
        id: msg
        if: ${{ always() && steps.audit.outputs.code != '0' }}
        run: |
          if [ "${{ steps.audit.outputs.code }}" = "1" ]; then
            echo 'text=:red_circle: *Checkpoint audit: missing checkpoints*\n\nOne or more commits reference a checkpoint that is not on the checkpoint remote. See the report artifact for the full table.' >> "$GITHUB_OUTPUT"
          else
            echo 'text=:red_circle: *Checkpoint audit failed to run*\n\nThe audit could not complete (remote or setup error); no report was produced. See the run log.' >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        if: ${{ always() && steps.audit.outputs.code != '0' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.E2E_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#d50200",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ steps.msg.outputs.text }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run details>"
                      }
                    }
                  ]
                }
              ]
            }

      - name: Fail the job on audit error
        if: ${{ steps.audit.outputs.code != '0' }}
        run: |
          echo "::error::checkpoint audit exited ${{ steps.audit.outputs.code }} (1 = missing checkpoints, 2 = remote/setup error)"
          exit 1
