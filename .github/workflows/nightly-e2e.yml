name: Nightly Install Smoke

# Every other E2E workflow builds the CLI from source. This one installs the
# published nightly the way a user does and runs one smoke test per agent
# against it, on each OS.

on:
  schedule:
    # 3h after nightly.yml tags at 06:00, so release.yml has published.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test name filter (regex)"
        required: false
        default: "TestMultiSessionSequential"

concurrency:
  group: nightly-install-smoke
  cancel-in-progress: true

jobs:
  claude-code:
    name: claude-code (${{ matrix.runner }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    with:
      agent: claude-code
      runner: ${{ matrix.runner }}
      cli-source: nightly
      test-regex: ${{ inputs.test || 'TestMultiSessionSequential' }}
      test-timeout-minutes: 20
      artifact-name: nightly-smoke-${{ matrix.runner }}-claude-code
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  opencode:
    name: opencode (${{ matrix.runner }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    with:
      agent: opencode
      runner: ${{ matrix.runner }}
      cli-source: nightly
      test-regex: ${{ inputs.test || 'TestMultiSessionSequential' }}
      test-timeout-minutes: 20
      artifact-name: nightly-smoke-${{ matrix.runner }}-opencode
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  codex:
    name: codex (${{ matrix.runner }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    with:
      agent: codex
      runner: ${{ matrix.runner }}
      cli-source: nightly
      test-regex: ${{ inputs.test || 'TestMultiSessionSequential' }}
      test-timeout-minutes: 20
      artifact-name: nightly-smoke-${{ matrix.runner }}-codex
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  cursor-cli:
    name: cursor-cli (${{ matrix.runner }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    with:
      agent: cursor-cli
      runner: ${{ matrix.runner }}
      cli-source: nightly
      test-regex: ${{ inputs.test || 'TestMultiSessionSequential' }}
      test-timeout-minutes: 20
      artifact-name: nightly-smoke-${{ matrix.runner }}-cursor-cli
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

  factoryai-droid:
    name: factoryai-droid (${{ matrix.runner }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    with:
      agent: factoryai-droid
      runner: ${{ matrix.runner }}
      cli-source: nightly
      test-regex: ${{ inputs.test || 'TestMultiSessionSequential' }}
      test-timeout-minutes: 20
      artifact-name: nightly-smoke-${{ matrix.runner }}-factoryai-droid
    secrets:
      FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

  copilot-cli:
    name: copilot-cli (${{ matrix.runner }})
    uses: ./.github/workflows/e2e-agent.yml
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    with:
      agent: copilot-cli
      runner: ${{ matrix.runner }}
      cli-source: nightly
      test-regex: ${{ inputs.test || 'TestMultiSessionSequential' }}
      test-timeout-minutes: 20
      artifact-name: nightly-smoke-${{ matrix.runner }}-copilot-cli
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-slack:
    runs-on: ubuntu-latest
    permissions: {}
    needs: [claude-code, opencode, codex, cursor-cli, factoryai-droid, copilot-cli]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.event_name == 'schedule' }}
    steps:
      - name: Notify Slack of nightly smoke failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.E2E_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#d50200",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": ":red_circle: *Nightly install smoke failed* — the published nightly CLI did not pass the checkpoint smoke test on at least one OS.\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run details>"
                      }
                    }
                  ]
                }
              ]
            }
