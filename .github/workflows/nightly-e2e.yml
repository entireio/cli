name: Nightly Install Smoke

# Every other E2E workflow builds the CLI from source. This one installs the
# published releases the way a user does: the nightly, with one smoke test per
# agent against it on each OS, and the stable cask, which is install-only.

on:
  schedule:
    # 3h after nightly.yml tags at 06:00, so release.yml has published.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test name filter (regex)"
        required: false
        # Keep in sync with the TEST_FILTER fallback below, which is what a
        # scheduled run uses.
        default: "TestMultiSessionSequential"

concurrency:
  group: nightly-install-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    # Above the sum of the agents' own retry ceilings (~108m: 9 + 18 + 13.5 +
    # 13.5 + 18 + 13.5 + 22.5, see the step caps below) plus setup, so the
    # per-step cap is always the one that binds — a step timeout leaves an
    # attributable row in the table, a job timeout kills Summarize and the
    # artifact upload with it. Legs measure 6m30s-8m40s; this only binds on a
    # hang in one of the uncapped setup steps.
    timeout-minutes: 115
    permissions:
      contents: read
      actions: read
      # For copilot-cli. Permissions are job-wide, so the install steps see
      # this scope too — accepted: they install and run the binary every later
      # step executes with the agent keys and this token, so withholding it
      # there guards nothing. Public repo, so only the Copilot quota has value.
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # What a first-run `entire enable` writes (setup.go). Unset, the harness
      # pins legacy git-branch, which no fresh install has.
      E2E_CHECKPOINT_STORE: git-refs
      TEST_FILTER: ${{ github.event.inputs.test || 'TestMultiSessionSequential' }}
      # Not $PWD: under Git Bash that is /d/a/cli/cli, which the Go test binary
      # resolves against the current drive.
      ARTIFACT_ROOT: ${{ github.workspace }}/e2e/artifacts

    steps:
      # Install first, checkout second: the ref comes from the installed
      # binary's version. GITHUB_TOKEN because the installers resolve the tag
      # through the releases API, which 403s unauthenticated from a shared
      # runner IP (reported as "check your internet connection").
      - name: Install nightly CLI (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Third-party install endpoints fail for reasons this repo can neither
          # fix nor predict -- run 36007855846 lost two e2e legs at once to a
          # gzipped installer and an unreachable version endpoint. Retry rather
          # than redden a scheduled run. (pipefail is already set above, which
          # `curl ... | bash` needs: the pipeline reports BASH's status, so a
          # failed fetch otherwise exits 0 having installed nothing.)
          retry() {
            local attempt=1
            while true; do
              if bash -euo pipefail -c "$1"; then
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "::error::install failed after $attempt attempts: $1"
                return 1
              fi
              echo "install attempt $attempt failed; retrying in $((attempt * 5))s" >&2
              sleep "$((attempt * 5))"
              attempt=$((attempt + 1))
            done
          }

          retry 'curl -fsSL https://entire.io/install.sh | bash -s -- --channel nightly'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install nightly CLI (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          # Third-party install endpoints fail for reasons this repo can neither
          # fix nor predict -- run 36007855846 lost two e2e legs at once to a
          # gzipped installer and an unreachable version endpoint. Retry rather
          # than redden a scheduled run. (pipefail is already set above, which
          # `curl ... | bash` needs: the pipeline reports BASH's status, so a
          # failed fetch otherwise exits 0 having installed nothing.)
          retry() {
            local attempt=1
            while true; do
              if bash -euo pipefail -c "$1"; then
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "::error::install failed after $attempt attempts: $1"
                return 1
              fi
              echo "install attempt $attempt failed; retrying in $((attempt * 5))s" >&2
              sleep "$((attempt * 5))"
              attempt=$((attempt + 1))
            done
          }

          retry 'brew install --cask entireio/tap/entire@nightly'

      # The README's nightly invocation. The installer updates only the stored
      # user PATH, which later steps do not re-read, hence GITHUB_PATH.
      - name: Install nightly CLI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Third-party install endpoints fail for reasons this repo can neither
          # fix nor predict (run 36007855846 lost two Unix legs to a gzipped
          # installer and an unreachable version endpoint). Retry each install.
          #
          # Limit worth stating: this retries the THROW path only. An installer
          # that calls exit instead ends the step before the catch runs -- per
          # the notes below that is droid's shape, so its transient failures
          # still redden the run. Isolating each installer in a child pwsh
          # would close that, and is untested here.
          function Invoke-WithRetry {
            param([Parameter(Mandatory)][scriptblock] $Install)
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                & $Install
                return
              } catch {
                if ($attempt -eq 3) { throw }
                Write-Host "install attempt $attempt failed: $($_.Exception.Message); retrying in $($attempt * 5)s"
                Start-Sleep -Seconds ($attempt * 5)
              }
            }
          }

          Invoke-WithRetry { iex "& {$(irm https://entire.io/install.ps1)} -Channel nightly" }
          "$HOME\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Pin the checkout to the tag that produced the installed binary, so the
      # harness and the CLI under test come from one commit.
      - name: Resolve nightly tag and binary path (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          version_line=$(entire version | head -1)
          echo "$version_line"
          tag="v$(echo "$version_line" | awk '{print $3}')"
          # Fail closed: a stable or unparseable version means the install
          # resolved the wrong channel.
          case "$tag" in
            v*-nightly.*) ;;
            *) echo "expected a v*-nightly.* version, got '$tag'" >&2; exit 1 ;;
          esac
          {
            echo "NIGHTLY_TAG=$tag"
            echo "E2E_ENTIRE_BIN=$(command -v entire)"
          } >> "$GITHUB_ENV"

      - name: Resolve nightly tag and binary path (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Stop is what makes the Write-Error below terminating. The runner
          # prepends it too, but this step depends on it, so it says so.
          $ErrorActionPreference = "Stop"
          $versionLine = (entire version | Select-Object -First 1)
          Write-Host $versionLine
          $tag = "v$($versionLine.Split(' ')[2])"
          # Fail closed: a stable or unparseable version means the install
          # resolved the wrong channel.
          if ($tag -notlike "v*-nightly.*") {
            Write-Error "expected a v*-nightly.* version, got '$tag'"
          }
          "NIGHTLY_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_ENTIRE_BIN=$((Get-Command entire).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Windows reads the version from the binary's PE resource section, not
      # from the ldflags stamp `entire version` prints (#2218). Compared against
      # the tag this nightly was built from, so resources generated for the
      # wrong version fail here too, not only missing ones.
      - name: Verify Windows PE version metadata
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Stop is what makes the Write-Error calls below terminating.
          $ErrorActionPreference = "Stop"
          # goreleaser passes {{.Version}}, which is the tag without its "v".
          $expected = $env:NIGHTLY_TAG -replace '^v', ''
          # The numeric tuple carries major.minor.patch only; the prerelease
          # suffix lives in the string fields.
          $expectedNumeric = [version]"$($expected -replace '-.*', '').0"
          foreach ($name in "entire", "git-remote-entire") {
            $command = Get-Command $name
            $product = (Get-Item $command.Source).VersionInfo.ProductVersion
            Write-Host "$name  $($command.Version)  $product"
            if ($command.Version -ne $expectedNumeric) {
              Write-Error "$name PE version is $($command.Version), expected $expectedNumeric from $env:NIGHTLY_TAG"
            }
            if ($product -ne $expected) {
              Write-Error "$name PE product version is '$product', expected '$expected'"
            }
          }

      - name: Checkout the nightly tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_TAG }}
          # An agent process runs in this checkout; keep the token out of
          # .git/config.
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4

      # TestMain's preflight requires tmux off Windows, even for headless tests.
      - name: Install tmux (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tmux

      # Excluded everywhere: pi (no CI installer), vogon and roger-roger (not
      # shipped agents).
      - name: Install agent CLIs (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          # Third-party install endpoints fail for reasons this repo can neither
          # fix nor predict -- run 36007855846 lost two e2e legs at once to a
          # gzipped installer and an unreachable version endpoint. Retry rather
          # than redden a scheduled run. (pipefail is already set above, which
          # `curl ... | bash` needs: the pipeline reports BASH's status, so a
          # failed fetch otherwise exits 0 having installed nothing.)
          retry() {
            local attempt=1
            while true; do
              if bash -euo pipefail -c "$1"; then
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "::error::install failed after $attempt attempts: $1"
                return 1
              fi
              echo "install attempt $attempt failed; retrying in $((attempt * 5))s" >&2
              sleep "$((attempt * 5))"
              attempt=$((attempt + 1))
            done
          }

          retry 'curl -fsSL https://claude.ai/install.sh | bash'
          retry 'curl https://cursor.com/install -fsS | bash'
          retry 'curl -fsSL https://app.factory.ai/cli | sh'
          # opencode by npm: its install script resolves its version through an
          # unauthenticated api.github.com call it gives no way to authenticate,
          # so it is rate-limited at random.
          retry 'npm install -g @openai/codex @github/copilot opencode-ai'
          # agy's official installer: it resolves OS and architecture itself,
          # verifies a SHA-512 from the release manifest, and installs latest
          # into ~/.local/bin, which the line below puts on PATH.
          retry 'curl -fsSL https://antigravity.google/cli/install.sh | bash'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "AGENTS=claude-code opencode codex cursor-cli factoryai-droid copilot-cli antigravity" >> "$GITHUB_ENV"

      # cursor-cli is the only absence here: its E2E driver sends every prompt
      # through tmux (e2e/agents/cursor_cli.go), because Cursor's headless -p
      # mode fires no hooks — and there is no tmux on Windows.
      #
      # antigravity matters most on this leg: it is the one agent whose Windows
      # hook path differs from its Unix one (agy hands hook commands to
      # cmd.exe, not sh), and a hook that fails there is silent — agy still
      # reports success. Nothing else exercises that path automatically.
      - name: Install agent CLIs (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Third-party install endpoints fail for reasons this repo can neither
          # fix nor predict (run 36007855846 lost two Unix legs to a gzipped
          # installer and an unreachable version endpoint). Retry each install.
          #
          # Limit worth stating: this retries the THROW path only. An installer
          # that calls exit instead ends the step before the catch runs -- per
          # the notes below that is droid's shape, so its transient failures
          # still redden the run. Isolating each installer in a child pwsh
          # would close that, and is untested here.
          function Invoke-WithRetry {
            param([Parameter(Mandatory)][scriptblock] $Install)
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                & $Install
                return
              } catch {
                if ($attempt -eq 3) { throw }
                Write-Host "install attempt $attempt failed: $($_.Exception.Message); retrying in $($attempt * 5)s"
                Start-Sleep -Seconds ($attempt * 5)
              }
            }
          }

          Invoke-WithRetry { irm https://claude.ai/install.ps1 | iex }
          Invoke-WithRetry { irm https://app.factory.ai/cli/windows | iex }
          Invoke-WithRetry { irm https://antigravity.google/cli/install.ps1 | iex }
          Invoke-WithRetry {
            npm install -g @openai/codex @github/copilot opencode-ai
            # Stop does not cover native commands ($PSNativeCommandUseError-
            # ActionPreference defaults to $false), so npm's failure needs this.
            if ($LASTEXITCODE -ne 0) { throw "npm install failed (exit $LASTEXITCODE)" }
          }
          # None of the three iex lines needs such a guard: each installer
          # throws or exits on every failure path, and that ends this step.
          # Verified 2026-09-09 for claude, 2026-09-10 for droid, whose
          # installer shadows Write-Error with one that exits 1, and
          # 2026-09-23 for agy, which throws rather than exits when it is run
          # sourced, as `| iex` runs it.
          "$HOME\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # droid's Windows installer puts droid.exe in %USERPROFILE%\bin, not
          # .local\bin, and updates only the stored user PATH, which later
          # steps do not re-read.
          "$HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # agy lands in %LOCALAPPDATA%\agy\bin, and its installer updates the
          # stored user PATH the same way. It picks the architecture itself and
          # always serves latest, so there is nothing to keep in sync here;
          # e2e.yml downloads a release tarball instead only because it pins an
          # exact version, which this installer has no flag for.
          "$env:LOCALAPPDATA\agy\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "AGENTS=claude-code codex copilot-cli opencode factoryai-droid antigravity" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # One step per agent: a step timeout is the only per-agent bound that
      # works on all three runners (macOS has no timeout(1)), and one hung agent
      # in a shared loop would take every later agent's verdict with it.
      # `!cancelled()` so a killed step does not skip the rest.
      #
      # 20 minutes is sized from the harness's retry ceiling, not from the
      # observed 23s-2m40s: runForAgents gives each scenario attempt
      # 3 min x the agent's TimeoutMultiplier and allows 3 attempts, so a
      # transient-error restart chain it is designed to recover from takes up to
      # 18 min for the 2.0x agents (opencode, factoryai-droid). A tighter bound
      # would kill a recovering run and report it as a failure.
      #
      # In each body: `set +e` because GitHub already runs `shell: bash` with
      # -e, which would end the step before its result row is written; the
      # closing `exit "$rc"` then reports the agent's own verdict on its own
      # step, and the `!cancelled()` gates above are what keep the later agents
      # running after it fails. The `Total: 0` check because a filter matching
      # no test exits 0 with "[no tests to run]", which would report every
      # agent as passing. Per-agent E2E_ARTIFACT_DIR because the mise task
      # otherwise derives one shared dir and later agents overwrite earlier
      # reports.
      #
      # E2E_ENTIRE_BIN (job env, set above) is what makes this the *installed*
      # nightly: the mise task skips its build when it is set.
      #
      # The seven bodies are byte-identical; only AGENT, the key and (for
      # antigravity, whose TimeoutMultiplier is 2.5x) the step cap differ.
      - name: Smoke test claude-code
        if: ${{ !cancelled() && contains(format(' {0} ', env.AGENTS), ' claude-code ') }}
        timeout-minutes: 20
        shell: bash
        env:
          AGENT: claude-code
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p e2e/artifacts
          go run ./e2e/bootstrap "$AGENT" &&
            E2E_ARTIFACT_DIR="$ARTIFACT_ROOT/$AGENT" \
              mise run test:e2e --agent "$AGENT" "$TEST_FILTER"
          rc=$?
          grep -q '^Total: 0 ' "$ARTIFACT_ROOT/$AGENT/report.txt" 2>/dev/null && rc=1
          echo "$AGENT $rc" >> e2e/artifacts/results.txt
          exit "$rc"

      - name: Smoke test opencode
        if: ${{ !cancelled() && contains(format(' {0} ', env.AGENTS), ' opencode ') }}
        timeout-minutes: 20
        shell: bash
        env:
          AGENT: opencode
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p e2e/artifacts
          go run ./e2e/bootstrap "$AGENT" &&
            E2E_ARTIFACT_DIR="$ARTIFACT_ROOT/$AGENT" \
              mise run test:e2e --agent "$AGENT" "$TEST_FILTER"
          rc=$?
          grep -q '^Total: 0 ' "$ARTIFACT_ROOT/$AGENT/report.txt" 2>/dev/null && rc=1
          echo "$AGENT $rc" >> e2e/artifacts/results.txt
          exit "$rc"

      - name: Smoke test codex
        if: ${{ !cancelled() && contains(format(' {0} ', env.AGENTS), ' codex ') }}
        timeout-minutes: 20
        shell: bash
        env:
          AGENT: codex
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          E2E_CODEX_MODEL: gpt-6-luna
        run: |
          set +e
          set -uo pipefail
          mkdir -p e2e/artifacts
          go run ./e2e/bootstrap "$AGENT" &&
            E2E_ARTIFACT_DIR="$ARTIFACT_ROOT/$AGENT" \
              mise run test:e2e --agent "$AGENT" "$TEST_FILTER"
          rc=$?
          grep -q '^Total: 0 ' "$ARTIFACT_ROOT/$AGENT/report.txt" 2>/dev/null && rc=1
          echo "$AGENT $rc" >> e2e/artifacts/results.txt
          exit "$rc"

      - name: Smoke test cursor-cli
        if: ${{ !cancelled() && contains(format(' {0} ', env.AGENTS), ' cursor-cli ') }}
        timeout-minutes: 20
        shell: bash
        env:
          AGENT: cursor-cli
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p e2e/artifacts
          go run ./e2e/bootstrap "$AGENT" &&
            E2E_ARTIFACT_DIR="$ARTIFACT_ROOT/$AGENT" \
              mise run test:e2e --agent "$AGENT" "$TEST_FILTER"
          rc=$?
          grep -q '^Total: 0 ' "$ARTIFACT_ROOT/$AGENT/report.txt" 2>/dev/null && rc=1
          echo "$AGENT $rc" >> e2e/artifacts/results.txt
          exit "$rc"

      - name: Smoke test factoryai-droid
        if: ${{ !cancelled() && contains(format(' {0} ', env.AGENTS), ' factoryai-droid ') }}
        timeout-minutes: 20
        shell: bash
        env:
          AGENT: factoryai-droid
          # droid.go writes ANTHROPIC_API_KEY into droid's BYOK settings.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p e2e/artifacts
          go run ./e2e/bootstrap "$AGENT" &&
            E2E_ARTIFACT_DIR="$ARTIFACT_ROOT/$AGENT" \
              mise run test:e2e --agent "$AGENT" "$TEST_FILTER"
          rc=$?
          grep -q '^Total: 0 ' "$ARTIFACT_ROOT/$AGENT/report.txt" 2>/dev/null && rc=1
          echo "$AGENT $rc" >> e2e/artifacts/results.txt
          exit "$rc"

      - name: Smoke test copilot-cli
        if: ${{ !cancelled() && contains(format(' {0} ', env.AGENTS), ' copilot-cli ') }}
        timeout-minutes: 20
        shell: bash
        env:
          AGENT: copilot-cli
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p e2e/artifacts
          go run ./e2e/bootstrap "$AGENT" &&
            E2E_ARTIFACT_DIR="$ARTIFACT_ROOT/$AGENT" \
              mise run test:e2e --agent "$AGENT" "$TEST_FILTER"
          rc=$?
          grep -q '^Total: 0 ' "$ARTIFACT_ROOT/$AGENT/report.txt" 2>/dev/null && rc=1
          echo "$AGENT $rc" >> e2e/artifacts/results.txt
          exit "$rc"

      # 25 minutes: 3 attempts x 3 min x the 2.5x multiplier is 22.5 min.
      # GEMINI_API_KEY selects agy's API-key mode (no account session); the
      # harness writes modelProvider=gemini into an isolated HOME itself.
      - name: Smoke test antigravity
        if: ${{ !cancelled() && contains(format(' {0} ', env.AGENTS), ' antigravity ') }}
        timeout-minutes: 25
        shell: bash
        env:
          AGENT: antigravity
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p e2e/artifacts
          go run ./e2e/bootstrap "$AGENT" &&
            E2E_ARTIFACT_DIR="$ARTIFACT_ROOT/$AGENT" \
              mise run test:e2e --agent "$AGENT" "$TEST_FILTER"
          rc=$?
          grep -q '^Total: 0 ' "$ARTIFACT_ROOT/$AGENT/report.txt" 2>/dev/null && rc=1
          echo "$AGENT $rc" >> e2e/artifacts/results.txt
          exit "$rc"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # Absent when the job failed before the agent list was written.
          [ -n "${AGENTS:-}" ] || { echo "no agent ran" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          mkdir -p e2e/artifacts
          results=e2e/artifacts/results.txt
          [ -f "$results" ] || : > "$results"
          {
            echo "### ${{ matrix.os }} — \`${NIGHTLY_TAG:-unknown}\`"
            echo ""
            echo "| agent | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          # Driven by the agent list, not the rows: a step killed by its
          # timeout writes no row and must still show as a failure.
          for agent in $AGENTS; do
            rc=$(awk -v a="$agent" '$1 == a { print $2 }' "$results")
            case "$rc" in
              0) echo "| $agent | ✅ pass |" >> "$GITHUB_STEP_SUMMARY" ;;
              "") echo "| $agent | ❌ no result (step timed out or was killed) |" >> "$GITHUB_STEP_SUMMARY"; failed=1 ;;
              *) echo "| $agent | ❌ fail (exit $rc) |" >> "$GITHUB_STEP_SUMMARY"; failed=1 ;;
            esac
          done
          exit "$failed"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-smoke-${{ matrix.os }}
          path: e2e/artifacts/
          retention-days: 7

  # Install-only: stable predates this checkout, so it gets no E2E (#2394).
  stable-install:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Install stable CLI with the documented command
        run: |
          set -euo pipefail
          brew install --cask entireio/tap/entire

      - name: Verify the install
        run: |
          set -euo pipefail
          # No `brew tap` ran, so the tap being present proves the auto-tap.
          brew tap | grep -qx 'entireio/tap'
          # The cask ships both binaries; git-remote-entire backs entire:// clones.
          command -v entire
          command -v git-remote-entire
          version_line=$(entire version | head -1)
          echo "$version_line"
          case "$version_line" in
            *nightly*)
              echo "::error::stable cask returned a nightly build: $version_line"
              exit 1
              ;;
          esac

  notify-slack:
    runs-on: ubuntu-latest
    permissions: {}
    needs: [smoke, stable-install]
    if: ${{ always() && (needs.smoke.result == 'failure' || needs['stable-install'].result == 'failure') && github.event_name == 'schedule' }}
    steps:
      - name: Notify Slack of nightly smoke failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.E2E_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
