name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (semver with v prefix, e.g. v1.2.3)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Deliberately NOT serialized with a concurrency group. GitHub keeps at most one
# pending run per group and cancels the previously pending one, which
# cancel-in-progress: false does not prevent — it only protects the run already
# in progress. mirror-nightly pushes a nightly tag, so a single stable release
# can enqueue a second run and cancel a queued hotfix by itself. Dropping a
# release is worse than the race a group would close, and the pointer's
# conditional write (--if-match in publish-channel-manifest.sh) already closes
# that race, including for runs started by hand.

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Mint the OIDC token that configure-aws-credentials exchanges for
      # short-lived credentials to the release-mirror bucket. Scoped to this
      # job so the other jobs keep the workflow-level permissions.
      id-token: write
    outputs:
      prerelease: ${{ steps.release-type.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Generate Homebrew Tap token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            homebrew-tap
            scoop-bucket

      - name: Detect release type
        id: release-type
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.release-type.outputs.prerelease == 'false'
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" 'BEGIN{header="^## \\[" ver "\\]"} $0 ~ header{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if [ ! -s "$RUNNER_TEMP/release_notes.md" ]; then
            echo "::error::No changelog entry found for version ${VERSION} in CHANGELOG.md"
            exit 1
          fi

      - name: Generate nightly release notes
        if: steps.release-type.outputs.prerelease == 'true'
        run: |
          LAST_NIGHTLY=$(git tag -l 'v*-nightly.*' --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -1)
          if [ -n "$LAST_NIGHTLY" ]; then
            BASE_TAG="$LAST_NIGHTLY"
          else
            BASE_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD 2>/dev/null || echo "")
          fi
          echo "## Nightly Build (${RELEASE_TAG})" > "$RUNNER_TEMP/release_notes.md"
          echo "" >> "$RUNNER_TEMP/release_notes.md"
          if [ -n "$BASE_TAG" ]; then
            echo "Changes since ${BASE_TAG}:" >> "$RUNNER_TEMP/release_notes.md"
            echo "" >> "$RUNNER_TEMP/release_notes.md"
            git log --oneline "${BASE_TAG}..HEAD" --no-merges >> "$RUNNER_TEMP/release_notes.md"
          fi

      - name: Detect macOS signing availability
        id: signing
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
        run: |
          if [ -n "$MACOS_SIGN_P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # The release mirror is opt-in: with ENTIRE_RELEASE_BUCKET unset, this and
      # the two steps below are skipped and the release publishes exactly as it
      # did before. Setting the repository variables turns the mirror on with no
      # code change. See docs/architecture/release-origins.md.
      - name: Configure AWS credentials for the release mirror
        if: vars.ENTIRE_RELEASE_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ENTIRE_RELEASE_UPLOAD_ROLE }}
          aws-region: ${{ vars.ENTIRE_RELEASE_REGION || 'us-east-2' }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release_notes.md
        env:
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_ENDPOINT: ${{ vars.POSTHOG_ENDPOINT }}
          ENTIRE_RELEASE_BUCKET: ${{ vars.ENTIRE_RELEASE_BUCKET }}
          ENTIRE_RELEASE_REGION: ${{ vars.ENTIRE_RELEASE_REGION }}
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}

      # Guard against the notarize pipe silently skipping (e.g. notarize.macos.ids
      # not matching the build ids). GoReleaser only warns and exits 0 in that
      # case, so the job stays green while shipping ad-hoc-signed binaries that
      # Gatekeeper kills on launch. We can't run codesign/spctl on Linux, but a
      # Developer ID signed Mach-O embeds the signing certificate, whose subject
      # ("Developer ID Application: … (TEAMID)") is greppable; an ad-hoc binary
      # embeds no certificate. Fail closed if any darwin binary is unsigned or if
      # none are found at all.
      - name: Verify macOS binaries are Developer ID signed
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mapfile -t bins < <(jq -r '.[] | select(.type=="Binary" and .goos=="darwin") | .path' dist/artifacts.json)
          if [ "${#bins[@]}" -eq 0 ]; then
            echo "::error::No darwin binaries found in dist/artifacts.json — cannot verify signing. Did the build matrix change?"
            exit 1
          fi
          fail=0
          for bin in "${bins[@]}"; do
            if grep -aq "Developer ID Application" "$bin"; then
              echo "ok: $bin is Developer ID signed"
            else
              echo "::error::$bin is NOT Developer ID signed (ad-hoc only) — the notarize pipe was skipped. Check that notarize.macos.ids in .goreleaser.yaml matches the build ids."
              fail=1
            fi
          done
          exit $fail

      # Last, and deliberately so. The pointer is what makes a version visible
      # to install.sh and to the CLI's update check, so it must not move until
      # the artifacts are uploaded AND the macOS signing check above has passed.
      # Advertising a release whose binaries Gatekeeper kills would be worse
      # than not advertising it at all.
      - name: Publish channel pointer
        if: vars.ENTIRE_RELEASE_BUCKET != ''
        run: |
          scripts/publish-channel-manifest.sh \
            --tag "$RELEASE_TAG" \
            --bucket "${{ vars.ENTIRE_RELEASE_BUCKET }}" \
            --region "${{ vars.ENTIRE_RELEASE_REGION || 'us-east-2' }}"

      # After the pointer, and stable-only. These keys (the two installers and
      # the Scoop manifest) are overwritten on every release rather than
      # versioned, so a nightly publishing here would replace the installer
      # stable users fetch; nightly users are served by the same stable
      # installer, which takes --channel nightly.
      #
      # After the pointer rather than before it: these keys are shared across
      # versions, so uploading first means a release the pointer then refuses
      # (an older tag re-dispatched) leaves the installers rolled back with
      # nothing advanced. The installer is version-independent, so a pointer
      # that moved before it is harmless.
      - name: Publish install scripts and Scoop manifest
        if: vars.ENTIRE_RELEASE_BUCKET != '' && steps.release-type.outputs.prerelease == 'false'
        run: |
          scripts/publish-installers.sh \
            --bucket "${{ vars.ENTIRE_RELEASE_BUCKET }}" \
            --region "${{ vars.ENTIRE_RELEASE_REGION || 'us-east-2' }}"

  # A stable tag only refreshes the stable cask; the nightly channel would
  # otherwise not catch up until the next scheduled nightly run cuts a tag from
  # a *newer* commit (and create-nightly-tag.sh skips when HEAD already has a
  # nightly). To ship the release on both channels immediately, cut a nightly
  # tag from the exact stable commit and push it. That push re-triggers this
  # workflow on the nightly-tag path, which uploads the entire@nightly cask.
  mirror-nightly:
    runs-on: ubuntu-latest
    needs: [release]
    # Only mirror stable releases. On a nightly-tag run the release job already
    # published the nightly channel, so this would recurse — skip it there.
    if: ${{ needs.release.result == 'success' && needs.release.outputs.prerelease == 'false' }}
    steps:
      # A cli-scoped GitHub App token (not the default GITHUB_TOKEN) so the tag
      # push triggers a fresh workflow run — GITHUB_TOKEN pushes are suppressed
      # to prevent recursion, which would leave the nightly cask un-uploaded.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cli

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Cut nightly tag from the stable commit
        run: |
          TAG=$(scripts/create-nightly-tag.sh) && EXIT_CODE=0 || EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "Nightly already current for this commit — nothing to mirror."
            exit 0
          elif [ "$EXIT_CODE" -ne 0 ] || [ -z "$TAG" ]; then
            echo "::error::Failed to generate nightly tag to mirror ${RELEASE_TAG}"
            exit 1
          fi
          echo "Mirroring ${RELEASE_TAG} to nightly channel as ${TAG}"
          git tag "$TAG"
          git push origin "$TAG"

  notify-slack:
    runs-on: ubuntu-latest
    needs: [release, mirror-nightly]
    if: ${{ always() && (needs.release.result == 'failure' || needs.mirror-nightly.result == 'failure') }}
    steps:
      - name: Notify Slack of release failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.E2E_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":red_circle: *Release Failed* for `${{ env.RELEASE_TAG }}`\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run details>"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Tag: `${{ env.RELEASE_TAG }}` by ${{ github.actor }}"
                    }
                  ]
                }
              ]
            }
