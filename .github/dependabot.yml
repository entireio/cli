version: 2
updates:
  # Maintain dependencies for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # Group minor and patch updates together
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Separate major version updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # betterleaks >=1.6.0 has a data race in internal/exprruntime
      # (concurrent DetectString), see betterleaks/betterleaks#224.
      # Pinned to 1.5.0 until fixed upstream.
      - dependency-name: "github.com/betterleaks/betterleaks"
        versions: [">=1.6.0"]
      # go-runewidth >=0.0.26 builds a 2.2MB width lookup table
      # (strictWidthLUT) eagerly in package init(), adding ~15ms to every
      # entire invocation — including every hook fire on every agent turn.
      # Pinned to 0.0.25 until the LUT is built lazily upstream.
      - dependency-name: "github.com/mattn/go-runewidth"
        versions: [">=0.0.26"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      # CodeQL subactions (init, analyze, ...) share one monorepo release and
      # must move together — a version mismatch fails the CodeQL job with
      # "Loaded a configuration file for version X, but running version Y".
      # Grouping bundles every github/codeql-action/* bump into one PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
