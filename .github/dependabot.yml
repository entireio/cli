version: 2
updates:
  # Maintain dependencies for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # Group minor and patch updates together
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Separate major version updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # betterleaks >=1.6.0 has a data race in internal/exprruntime
      # (concurrent DetectString), see betterleaks/betterleaks#224.
      # Pinned to 1.5.0 until fixed upstream.
      - dependency-name: "github.com/betterleaks/betterleaks"
        versions: [">=1.6.0"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
