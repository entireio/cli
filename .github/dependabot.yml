version: 2
updates:
  # Maintain dependencies for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # Group minor and patch updates together
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Separate major version updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # goredact bumps are gated by the redaction corpus A/B (same regime as
      # betterleaks); upgrade deliberately, never automatically.
      - dependency-name: "github.com/lastpersonlabs/goredact"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      # CodeQL subactions (init, analyze, ...) share one monorepo release and
      # must move together — a version mismatch fails the CodeQL job with
      # "Loaded a configuration file for version X, but running version Y".
      # Grouping bundles every github/codeql-action/* bump into one PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
