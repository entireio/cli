version: "2"
# Without these, every `//go:build integration` and `//go:build e2e` file is
# invisible to golangci-lint.
run:
  build-tags:
    - integration
    - e2e
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - decorder
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - gosec
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - intrange
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - sloglint
    - spancheck
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    gosec:
      excludes:
        - G204 # subprocess with variables is expected for git/opencode CLI wrappers
        - G702 # command injection via taint - controlled CLI inputs
        - G705 # XSS not applicable to CLI stderr output
    dupl:
      # Token threshold for duplication detection
      # Lower = more sensitive (catches smaller duplicates)
      # Default is 150. We use 75 for lint (blocks CI), `mise run dup` uses 50 (advisory)
      threshold: 75
    errcheck:
      check-type-assertions: true
      check-blank: true
    wrapcheck:
      # Errors from the generated control-plane client are mapped centrally
      # by renderCoreError (cmd/entire/cli/corecmd.go), which extracts the
      # RFC 7807 problem detail via errors.As. Per-call-site wrapping would
      # only be unwrapped again, so the command closures return coreapi
      # errors verbatim.
      #
      # checkpointpolicy.EnsureCanReadVersion already returns a clean,
      # user-facing message (including the checkpoint ID and version), and
      # callers classify it via IsUnsupportedVersion. Wrapping would obscure
      # that purpose-built message, so call sites return it verbatim.
      ignore-package-globs:
        - github.com/entireio/cli/internal/coreapi
        - github.com/entireio/cli/cmd/entire/cli/checkpointpolicy
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.Getwd$'
          msg: "os.Getwd() breaks when running from subdirectories - use paths.RepoRoot() for git-relative paths"
          pkg: '^os$'
        - pattern: '^.*\.Reset$'
          msg: "go-git Reset deletes .gitignored dirs - use HardResetWithProtection() from common.go"
          pkg: 'github\.com/go-git/go-git'
        - pattern: '^.*\.Checkout$'
          msg: "go-git Checkout deletes .gitignored dirs - use CheckoutBranch() from git_operations.go"
          pkg: 'github\.com/go-git/go-git'
        - pattern: '^.*Worktree\.Status$'
          msg: "go-git Worktree.Status() walks the whole worktree - use gitrepo.Status(ctx, repo)"
          pkg: 'github\.com/go-git/go-git'
        - pattern: '^.*\.(Print|Println|Printf)$'
          msg: "cobra's Print* writes to OutOrStderr (stderr in production); use fmt.Fprint*(cmd.OutOrStdout(), ...)"
          pkg: 'github\.com/spf13/cobra'
        # forbidigo matches identifiers/selectors, not call arguments, so it
        # cannot single out exec.Command(..., "git", ...) from other exec.Command
        # uses (spawning the test binary, "sh", etc). It bans the whole
        # exec.Command/CommandContext selector instead, scoped down to just the
        # test files that should exclusively shell to git through the isolated
        # helper (testutil.RunGit / gitenv.Run) via the path-except exclusion
        # below - see the "git isolation" exclusion rule.
        - pattern: '^exec\.(Command|CommandContext)$'
          msg: "raw exec.Command/CommandContext in this test file reads the developer's global gitconfig - shell out via testutil.RunGit(t, dir, args...) (or gitenv.Run) so GitIsolatedEnv() applies; see #2202"
          pkg: '^os/exec$'
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      attr-only: true
    testifylint:
      enable-all: true
    unparam:
      check-exported: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck
      # forbidigo's other rules (os.Getwd, go-git Reset/Checkout/Worktree.Status,
      # cobra Print*) are about production code; test files legitimately use
      # some of these APIs directly, so those specific messages stay exempt
      # here exactly as before. The git-isolation rule added above is NOT
      # listed here on purpose - it must keep firing in the handful of test
      # files it targets (see the path-except rule below), or the whole point
      # of adding it is defeated.
      - path: _test\.go
        linters:
          - forbidigo
        text: "os\\.Getwd\\(\\) breaks when running from subdirectories|go-git Reset deletes \\.gitignored dirs|go-git Checkout deletes \\.gitignored dirs|go-git Worktree\\.Status\\(\\) walks the whole worktree|cobra's Print\\* writes to OutOrStderr"
      # The git-isolation exec.Command/CommandContext ban (see forbidigo.forbid
      # above) is scoped to just the test files issue #2202 covers. Enabling it
      # repo-wide would also flag every other pre-existing direct git shell-out
      # in *_test.go (a much larger, separate cleanup) and the handful of
      # legitimate non-git exec.Command calls (spawning the built binary, `sh`
      # for a fake-failure fixture) inside these same files, which carry their
      # own //nolint:forbidigo instead. path-except keeps the issue suppressed
      # everywhere except inside this file list, i.e. it only fires there.
      - linters:
          - forbidigo
        text: "raw exec\\.Command/CommandContext in this test file reads the developer's global gitconfig"
        path-except: '(^|/)cmd/entire/cli/(review/scope_test\.go|gitrepo/gitstatus_guard_test\.go|strategy/commit_hook_perf_test\.go|review_context_test\.go|integration_test/resume_test\.go|checkpoint/redact_cache_scope_test\.go|checkpoint/remote/git_test\.go)$'
      - path: ^e2e/
        linters:
          - errcheck
          - gochecknoinits
          - goconst
          - gosec
          - noctx
          - revive
          - usetesting
          - wrapcheck
      # Test harness that happens not to end in _test.go, so the rules above
      # miss it. Same exemption `^e2e/` already gets for its support files.
      - path: ^cmd/entire/cli/integration_test/
        linters:
          - gosec
      - path: ^test/workloads/
        linters:
          - wrapcheck
      - path: ^internal/sim/
        linters:
          - wrapcheck
      # configloader.go is a thin os-backed billy.Basic adapter. It must return
      # raw os errors unwrapped so go-git's os.IsNotExist() fall-through (for
      # absent config files) keeps working; wrapping would break it.
      - path: ^cmd/entire/cli/checkpoint/configloader\.go$
        linters:
          - wrapcheck
      - text: "`strat` is a misspelling"
        linters:
          - misspell
